  - id: "el_ex_04"
    pinned: true
    description: "party_election_boycott — opposition coalition withdrawal, francophone Africa, French-language source"
    rationale: |
      Boycott anchor with two lessons: (1) a FORMAL party withdrawal is the
      codeable act (contrast: a conditional boycott threat is not); (2) the
      civil-society 'ville morte' (dead city) call in the same article is a
      citizen stay-away → protest domain (strike_boycott), not coded here.
      French-language source preserved as source_language: fr.
    article_snippet: |
      The main opposition coalition announced on Sunday its withdrawal from the
      presidential election scheduled for December 12, denouncing 'a rigged
      electoral register and a captured commission'. The coalition's candidate
      said its name would remain on the printed ballots but that any votes cast
      for him should be considered void. Civil society groups, meanwhile, called
      for a 'ville morte' operation on nomination day to press for an audit of
      the register. The electoral commission said the withdrawal changed nothing
      legally and the vote would proceed.
    extracted_events:
      - event_date: null
        country: null
        city: null
        region: null
        venue: null
        location_notes: null
        event_type: "party_election_boycott"
        election_name: "presidential election of December 12"
        election_phase: "pre_election"
        perpetrator_name: "main opposition coalition"
        perpetrator_category: "opposition_party"
