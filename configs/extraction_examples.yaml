  - id: "ex_12"
    pinned: true
    description: "Horn of Africa — Ethiopian market shutdown / stay-away, coercion test, repressed-country cap"
    rationale: |
      Pan-Africa v3 example. The ghost_town_stay_away edge case applied in the Horn:
      an opposition-called market shutdown with VOLUNTARY compliance reported →
      STRIKE_BOYCOTT. The rationale hinges on the coercion test: the article reports
      no enforcement violence, so this is protest, not an armed-group lockdown
      (which would return []). Ethiopia is CIVICUS-repressed and the report is
      single-sourced → confidence capped at medium even with good field coverage.
    article_snippet: |
      Shops and markets across several towns in the Oromia region stayed closed on
