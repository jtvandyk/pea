  - id: "ex_09"
    pinned: true
    description: "Police attack a peaceful march — stays demonstration_march, Uganda, repressed-country confidence cap"
    rationale: |
      Followup #13 tier-2 example. The most common escalation misclassification in
      reverse: when POLICE initiate the violence against a peaceful march, the event
      remains DEMONSTRATION_MARCH (violence must be protester-initiated for RIOT).
      state_response records the most severe response (live_ammunition > teargas >
      arrests). Uganda is CIVICUS-repressed, so field-completeness that would yield
      'high' is capped at 'medium' per civic_space_confidence_modifier.
    article_snippet: |
      Supporters of the National Unity Platform marched through Kampala's Kamwokya
      neighbourhood on Wednesday demanding the release of detained party activists.
      Witnesses said the march was peaceful, with participants singing and carrying
      placards, until military police blocked the route and fired teargas and then
      live rounds to disperse the crowd. One marcher was shot in the leg. At least
      fourteen people were detained, including two journalists covering the march.
      Party officials said they had notified police of the route in advance.
    extracted_events:
