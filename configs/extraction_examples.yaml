  - id: "ex_10"
    pinned: true
    description: "Negative example — cultural celebration with political attendance, Nigeria, returns []"
    rationale: |
      Followup #13 tier-2 example. Disqualifier-gate demonstration complementing
      ex_02 (AU summit): a large public gathering with chanting crowds and heavy
      police presence that is CELEBRATORY, not contentious. Political dignitaries
      attending and 'demands' quoted from a speech do not convert a festival into
      a protest — no collective action outside institutional channels occurred.
    article_snippet: |
      Tens of thousands of people filled the streets of Osogbo on Friday for the
      annual Osun-Osogbo festival, with crowds chanting praise songs as the
      procession moved to the sacred grove. The state governor, addressing the
      festival, called on the federal government to release funds for cultural
      tourism infrastructure. Police deployed more than 1,000 officers to manage
      the crowds, and several roads were closed for the procession. Organisers
      hailed a peaceful celebration attended by dignitaries from across the country.
    extracted_events: []

