  - id: "sr_ex_04"
    pinned: true
    description: "civil_society_restriction — mass NGO deregistration by decree, state-source confidence rule"
    rationale: |
      Organisational-restriction anchor: mass deregistration is ONE coordinated
      action (one event, target_count: 54) — not 54 events. Demonstrates the
      state-media rule: the government gazette is authoritative for the FACT of
      deregistration (confidence: high) while the stated justification
      ('foreign interference') is framing recorded in outcome_notes, never
      treated as evidence. state_response: organisational_dissolution feeds the
      turmoil derivation's high tier.
    article_snippet: |
      The government has deregistered 54 non-governmental organisations with
      immediate effect, according to a notice published in Friday's official
      gazette, which accused the groups of 'operating as conduits for foreign
      interference'. The list includes two of the country's oldest human rights
      organisations and a network of election observers. The interior minister
      said the organisations' assets would be frozen pending investigation.
      Civil society coalitions described the move as the largest single
      crackdown on the sector in a decade.
