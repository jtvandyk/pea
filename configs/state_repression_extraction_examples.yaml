examples:

  - id: "sr_ex_01"
    pinned: true
    description: "internet_shutdown — regional mobile internet cut ahead of protests, disputed attribution, medium confidence"
    rationale: |
      Shutdown anchor demonstrating #KeepItOn coding practice: the reported
      government-directed disruption is the event, coded WITHOUT technical
      verification. Attribution partially disputed (operators cite instructions,
      government blames technical issues) → confidence: medium with the dispute
      noted. scope_notes carries region/service scope. state_response:
      internet_shutdown drives the pipeline's turmoil derivation. The PLANNED
      protests are not extracted — they have not occurred.
    article_snippet: |
      Mobile internet services were cut across three regions on Wednesday evening,
      hours before demonstrations called by opposition groups were due to begin.
      Two telecommunications operators told customers the disruption followed
      'instructions from the competent authorities'. The communications ministry
      denied ordering a shutdown, attributing the outage to 'technical maintenance'.
      Digital rights group Access Now said the pattern was consistent with an
      ordered shutdown and called for services to be restored immediately.
    extracted_events:
