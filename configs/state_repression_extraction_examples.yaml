  - id: "sr_ex_02"
    pinned: true
    description: "Boundary example — teargassed march returns [] (protest-domain territory)"
    rationale: |
      THE core division-of-labour demonstration: repression that answers one
      specific protest is that protest event's state_response — the crowd, not
      the state, is the subject of the lede. This article is a protest-domain
      event (demonstration_march, state_response: teargas, arrests recorded).
      Coding it here would double-count the same physical act. The model must
      return [] despite the dense repression vocabulary.
    article_snippet: |
      Police fired teargas and arrested at least 20 people on Saturday as hundreds
      of demonstrators marched through downtown Nairobi against new tax measures.
      Officers in riot gear blocked the procession near parliament and chased
      protesters through side streets. A police spokesperson said the march was
      unlawful because organisers had not notified authorities. Rights groups
      condemned what they called excessive force against a peaceful assembly.
    extracted_events: []

  - id: "sr_ex_03"
    pinned: true
    description: "journalist_media_repression + activist_arrest_prosecution — two distinct targeted actions, one article"
    rationale: |
      Multi-event split across two types: (1) a regulator suspending a TV
      station over its coverage = JOURNALIST_MEDIA_REPRESSION (regulatory
      instrument, media target); (2) the days-later arrest of an activist AT
      HIS HOME over social media posts = ACTIVIST_ARREST_PROSECUTION —
      separately targeted, not an arrest at a protest. legal_instrument
      captures the named charge; state_response maps to the shared vocabulary
      (ban for the suspension, arrests + legal_criminalisation candidate for
      the cybercrime charge — the arrest is primary here).
    article_snippet: |
      The national broadcasting authority on Monday suspended Horizon TV for
      60 days, accusing the station of 'unbalanced coverage' of last week's
      fuel-price unrest. Press freedom groups called the suspension retaliation
      for the channel's footage of police shootings. Separately, police on
      Thursday arrested civic activist Daniel Okello at his home in the capital,
      charging him under the Computer Misuse Act over posts describing the same
      crackdown. His lawyer said the charge criminalises documentation of abuses.
